# Vesta 설정 (PROJECT.md 4.9). 생략한 값은 기본값을 쓴다.

inference:
  baseUrl: http://127.0.0.1:11434/v1     # OpenAI 호환 API (Ollama)
  ollamaUrl: http://127.0.0.1:11434

models:
  # M0 벤치마크로 확정 (PROJECT.md 13.1). Gemma4는 생각 모드가 기본이라 none으로 끈다
  # 메인·코드 모두 같은 모델 — 같은 모델이므로 keepAlive도 같게 둔다 (짧게 주면 메인 모델이 내려간다)
  general:   { name: "gemma4:26b-mxfp8", keepAlive: forever, reasoningEffort: none }
  code:      { name: "gemma4:26b-mxfp8", keepAlive: forever, reasoningEffort: none }
  # 임베딩: M2 평가(PROJECT.md 13.3)에서 qwen3-embedding:4b와 품질이 같고 색인 4배 빠름, 메모리 절반
  embedding: { name: "bge-m3:567m", keepAlive: forever }
  # 리랭커: 설치돼 있지만 기본은 끔 (평가셋에서 정확도 향상 없음, 검색 93ms → 520ms). 켜려면 주석을 푼다
  # reranker: { name: "bge-reranker-v2-m3", engine: llama-server, baseUrl: "http://127.0.0.1:8082" }
  # embedding: { name: "<임베딩 모델>", keepAlive: forever }
  # reranker:  { name: "<리랭커 모델>", keepAlive: forever }
  # 비전: Gemma 4가 이미지를 직접 읽으므로 메인 모델과 같게 (추가 메모리 없음, M12)
  vision:    { name: "gemma4:26b-mxfp8", keepAlive: forever, reasoningEffort: none }
  # 음성 인식: 미디어 워커(media-worker, uv)의 mlx-whisper. 30분 안 쓰면 워커가 내린다 (약 1.6GB)
  stt:       { name: "mlx-community/whisper-large-v3-turbo", engine: mlx-whisper, baseUrl: "http://127.0.0.1:11436", keepAlive: 30m }
  # 읽어 주기: macOS say (추가 메모리 0)
  tts:       { name: "Yuna", engine: say }

decision:
  engine: ollaya
  baseUrl: http://127.0.0.1:11435
  model: winnow:e4b            # M4 평가로 laya에서 교체 (PROJECT.md 13.5): 라우팅 99%, GPU 실행
  thresholds:
    agent: 0.6
    needsWeb: 0.5
    needsLocal: 0.5
  fallback: general

web:
  mode: AUTO                   # AUTO / ALWAYS / OFF
  searxngUrl: http://127.0.0.1:8888

memory:
  budgetPercent: 70

# 음성·이미지 입력 (PROJECT.md 7.11, M12)
media:
  ffmpeg: /opt/homebrew/bin/ffmpeg
  maxAudioSeconds: 300        # 넘으면 앞부분만 인식
  maxImageMegabytes: 10
  maxImages: 4                # 질문 하나에 붙일 수 있는 이미지 수

# 메신저 (PROJECT.md 6.5·6.6). 봇 토큰은 여기 쓰지 않는다: vesta telegram token (키체인 저장)
channels:
  telegram:
    enabled: true              # 토큰이 있을 때만 켜진다
    allowLocalSources: true    # 로컬 문서·코드·Apple 앱 내용이 들어간 답변도 보냄 (v1.0 결정)
    allowExecApproval: true    # 셸 승인을 텔레그램에서 받음 (v1.0 결정)
  discord:
    enabled: true              # 토큰이 있을 때만 켜진다 (vesta discord token)
    allowLocalSources: true
    allowExecApproval: true    # 셸 승인을 Discord에서 받음 (v1.0 결정)
  slack:
    enabled: true              # 봇·앱 토큰이 모두 있을 때만 켜진다 (vesta slack token)
    allowLocalSources: true
    allowExecApproval: true    # 셸 승인을 Slack에서 받음 (v1.0 결정)

# 멀티 유저 (PROJECT.md 7.12). 사용자 추가: vesta user add <이름> (MEMBER·GUEST)
users:
  maxParallel: 2               # 동시에 생성하는 요청 수. 넘으면 사용자별로 돌아가며 기다린다
  memberRoot: ~/Vesta/users    # MEMBER 파일 도구 폴더: <memberRoot>/<이름>
  # paths:                     # 사용자별 추가 허용 폴더
  #   mina: [~/Shared/가족사진]
