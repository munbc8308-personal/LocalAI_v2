# Vesta 설정 (PROJECT.md 4.9). 생략한 값은 기본값을 쓴다.

inference:
  baseUrl: http://127.0.0.1:11434/v1     # OpenAI 호환 API (Ollama)
  ollamaUrl: http://127.0.0.1:11434

models:
  # M0 벤치마크로 확정 (PROJECT.md 13.1). Gemma4는 생각 모드가 기본이라 none으로 끈다
  # 메인·코드 모두 같은 모델 — 같은 모델이므로 keepAlive도 같게 둔다 (짧게 주면 메인 모델이 내려간다)
  general:   { name: "gemma4:26b-mxfp8", keepAlive: forever, reasoningEffort: none }
  code:      { name: "gemma4:26b-mxfp8", keepAlive: forever, reasoningEffort: none }
  # 임베딩: M2 평가(PROJECT.md 13.3)에서 qwen3-embedding:4b와 품질이 같고 색인 4배 빠름, 메모리 절반
  embedding: { name: "bge-m3:567m", keepAlive: forever }
  # 리랭커: 설치돼 있지만 기본은 끔 (평가셋에서 정확도 향상 없음, 검색 93ms → 520ms). 켜려면 주석을 푼다
  # reranker: { name: "bge-reranker-v2-m3", engine: llama-server, baseUrl: "http://127.0.0.1:8082" }
  # embedding: { name: "<임베딩 모델>", keepAlive: forever }
  # reranker:  { name: "<리랭커 모델>", keepAlive: forever }

decision:
  engine: ollaya
  baseUrl: http://127.0.0.1:11435
  model: laya                  # 한국어 정확도 부족 시 decider
  thresholds:
    agent: 0.6
    needsWeb: 0.5
    needsLocal: 0.5
  fallback: general

web:
  mode: AUTO                   # AUTO / ALWAYS / OFF
  searxngUrl: http://127.0.0.1:8888

memory:
  budgetPercent: 70
