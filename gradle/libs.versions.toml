[versions]
jvm = "21"
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.6.0"
exposed = "1.6.0"
sqlite-jdbc = "3.53.4.0"
hoplite = "3.0.4"
clikt = "5.1.0"
kotlin-logging = "8.0.4"
logback = "1.6.5"
kotest = "6.2.6"
mockk = "1.14.11"
jline = "3.30.16"
pdfbox = "3.0.7"
jsoup = "1.23.2"
jspecify = "1.0.0"
compose = "1.12.2"
bouncycastle = "1.86"

# Discord 음성 채널 (M19): DAVE(종단 간 암호화)는 JDAVE(libdave, Java 25 FFM), Opus는 Homebrew libopus(arm64)를 JNA 5로
jda = "6.7.0"
jdave = "0.1.8"
jna = "5.17.0"
# DAVE 다른 구현 (JNI). JDAVE(FFM)는 소리 조각마다 70ms가 걸려 끊겼다 (M19). 커밋 해시 버전(2026-10-07)
libdave-jvm = "181fdecfa"

[libraries]
# build-logic 전용 (convention plugin 의존성)
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
compose-compiler-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
jdave-api = { module = "club.minnced:jdave-api", version.ref = "jdave" }
jdave-native-darwin = { module = "club.minnced:jdave-native-darwin", version.ref = "jdave" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
libdave-adapter-jda = { module = "moe.kyokobot.libdave:adapter-jda", version.ref = "libdave-jvm" }
libdave-impl-jni = { module = "moe.kyokobot.libdave:impl-jni", version.ref = "libdave-jvm" }
libdave-natives-darwin = { module = "moe.kyokobot.libdave:natives-darwin", version.ref = "libdave-jvm" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

hoplite-core = { module = "com.sksamuel.hoplite:hoplite-core", version.ref = "hoplite" }
hoplite-yaml = { module = "com.sksamuel.hoplite:hoplite-yaml", version.ref = "hoplite" }

clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }

kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
jline = { module = "org.jline:jline", version.ref = "jline" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
# jsoup의 null 표시 어노테이션 (컴파일 시에만 필요)
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
# 비밀번호 해시 (Argon2id)
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-html-core = { module = "org.jetbrains.compose.html:html-core", version.ref = "compose" }

[bundles]
ktor-server = ["ktor-server-core", "ktor-server-cio", "ktor-server-content-negotiation", "ktor-server-status-pages", "ktor-server-compression", "ktor-serialization-kotlinx-json"]
ktor-client = ["ktor-client-core", "ktor-client-cio", "ktor-client-content-negotiation", "ktor-serialization-kotlinx-json"]
exposed = ["exposed-core", "exposed-jdbc", "exposed-java-time", "sqlite-jdbc"]
testing = ["kotest-runner-junit5", "kotest-assertions-core", "mockk", "kotlinx-coroutines-test"]
